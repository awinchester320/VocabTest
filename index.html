<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rung · vocabulary demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,750&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F2F4F9; --surface:#FFFFFF; --ink:#182033; --muted:#5E6780; --line:#DCE1EC;
  --blue:#3452C7; --blue-soft:#E4E9FA; --gold:#B8820A; --gold-soft:#FBF1D8;
  --green:#1F7F54; --green-soft:#DDF2E7; --red:#C23535; --red-soft:#FBE3E3;
  --sans:"Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
  --serif:"Newsreader", Georgia, "Times New Roman", serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1422; --surface:#182036; --ink:#E8ECF5; --muted:#9AA4BD; --line:#2A3350;
    --blue:#8EA6FF; --blue-soft:#232E57; --gold:#F0C04A; --gold-soft:#3A301A;
    --green:#5CCB93; --green-soft:#173A2A; --red:#F07A7A; --red-soft:#432222;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1422; --surface:#182036; --ink:#E8ECF5; --muted:#9AA4BD; --line:#2A3350;
  --blue:#8EA6FF; --blue-soft:#232E57; --gold:#F0C04A; --gold-soft:#3A301A;
  --green:#5CCB93; --green-soft:#173A2A; --red:#F07A7A; --red-soft:#432222;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);-webkit-tap-highlight-color:transparent}
.app{max-width:560px;margin:0 auto;padding:14px 16px 48px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.15}
h1{font-size:2rem;font-weight:750;letter-spacing:-.02em}
h2{font-size:1.25rem;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.88rem}

.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px;min-height:40px}
.brand{font-weight:750;font-size:1.3rem;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.brand svg{width:22px;height:22px}
.link{background:none;border:0;color:var(--blue);font-weight:600;padding:8px 4px}
.back{background:none;border:0;color:var(--muted);font-weight:600;padding:8px 0;display:flex;gap:6px;align-items:center}

.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px 18px;font-weight:700;font-size:1.02rem;background:var(--blue);color:#fff;text-align:center}
:root[data-theme="dark"] .btn,.btn{}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#0F1422}}
:root[data-theme="dark"] .btn{color:#0F1422}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px}
.row>*{flex:1}
.stack>*+*{margin-top:12px}

.topr{display:flex;gap:14px}
.viewing{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--gold-soft);border-radius:12px;padding:8px 8px 8px 14px;margin:0 0 14px;font-size:.92rem;font-weight:600}
.viewing .link{padding:6px 8px}
.note{margin:14px 0 0;color:var(--muted);font-size:.92rem;text-align:center}
.cal{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:14px 12px 12px;margin-top:16px}
.calhead{display:flex;justify-content:space-between;align-items:center;margin:0 4px 10px}
.calhead h2{font-size:1.1rem}
.calnav{display:flex;gap:4px}
.calnav button{width:36px;height:36px;border-radius:10px;border:1.5px solid var(--line);background:none;font-size:1.1rem;line-height:1}
.calnav button:disabled{opacity:.3;cursor:default}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{font-size:.75rem;color:var(--muted);font-weight:600;text-align:center;padding:2px 0 6px}
.cd{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:12px;border:1.5px solid transparent;background:none;padding:0;font-weight:650;font-size:.95rem;color:var(--muted);min-width:0}
.cd.out{opacity:.35}
.cd.open{color:var(--ink);background:var(--bg)}
.cd.done{background:var(--green-soft);color:var(--green)}
.cd.today{border-color:var(--blue)}
.cd:disabled{cursor:default}
.cd .dots{display:flex;gap:3px}
.cd .dots i{width:5px;height:5px;border-radius:50%;background:var(--line)}
.cd .dots i.on{background:var(--green)}
.cd.done .dots i{background:var(--green)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin:12px 4px 0;font-size:.82rem;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:5px;display:inline-block}
.calstats{display:flex;gap:10px;margin-top:14px}
.calstats div{flex:1;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:10px 14px}
.calstats b{display:block;font-size:1.5rem;font-weight:750;letter-spacing:-.02em}
.calstats span{font-size:.85rem;color:var(--muted)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.session{list-style:none;margin:0 0 16px;padding:0}
.session li{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.session .num{width:30px;height:30px;border-radius:50%;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;font-weight:700;flex:0 0 auto}
.session .done .num{background:var(--green-soft);color:var(--green)}
.session .info{flex:1;min-width:0}
.session .info b{display:block;font-size:1.05rem}
.session .info span{font-size:.85rem;color:var(--muted)}
.session button{border:1.5px solid var(--line);background:transparent;border-radius:10px;padding:8px 12px;font-weight:600;font-size:.9rem}
.foot{display:flex;flex-wrap:wrap;gap:4px 16px;justify-content:center;margin-top:28px}

/* The Case */
.casefile{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 18px 18px;text-align:center;position:relative}
.casefile .tag{font-size:.8rem;color:var(--muted);font-weight:600}
.word{font-family:var(--serif);font-weight:500;font-size:clamp(2.4rem,11vw,3.4rem);line-height:1.05;margin:6px 0 4px;letter-spacing:-.01em}
.pron{color:var(--muted);font-size:.95rem}
.evidence{list-style:none;padding:0;margin:14px 0 0}
.evidence li{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.evidence li small{display:block;font-size:.76rem;font-weight:700;color:var(--blue);margin-bottom:2px}
.evidence li p{font-family:var(--serif);font-size:1.08rem;line-height:1.45}
.evidence li.fresh{animation:pop .35s ease-out}
@keyframes pop{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}
.suspects{display:grid;gap:8px;margin:14px 0}
.suspect{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:13px 14px;text-align:left;font-size:1rem;line-height:1.35}
.suspect:disabled{opacity:.45;text-decoration:line-through;cursor:default}
.suspect.right{border-color:var(--green);background:var(--green-soft);opacity:1;text-decoration:none}
.meter{display:flex;gap:6px;justify-content:center;margin-top:12px}
.meter i{width:26px;height:6px;border-radius:3px;background:var(--line)}
.meter i.on{background:var(--blue)}
.verdict{font-size:1.6rem;font-weight:750;text-align:center;margin:6px 0 2px}
.reveal{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0}
.reveal .def{font-family:var(--serif);font-size:1.2rem;line-height:1.45}
.reveal h3{font-size:.85rem;color:var(--muted);margin:14px 0 4px;font-weight:700}
.reveal p.body{font-family:var(--serif);font-size:1.02rem;line-height:1.55}

/* Codewords */
.status{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:600}
.lives{letter-spacing:3px;color:var(--red)}
.signal{background:var(--ink);color:var(--bg);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.signal small{display:block;font-size:.78rem;opacity:.75;font-weight:600}
.signal b{font-size:1.15rem;font-weight:700}
.signal .count{float:right;background:var(--bg);color:var(--ink);border-radius:999px;padding:2px 10px;font-weight:750;margin-left:10px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:16px 4px;font-family:var(--serif);font-size:clamp(.95rem,4vw,1.1rem);text-align:center;min-height:56px;overflow-wrap:anywhere}
.tile.hit{background:var(--green);border-color:var(--green);color:var(--surface)}
.tile.trap{background:var(--red);border-color:var(--red);color:var(--surface)}
.tile.shown{background:var(--green-soft);border-color:var(--green);border-style:dashed}
.tile.used{opacity:.4}
.tile.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.tools{display:flex;gap:10px;margin-top:12px;align-items:center}
.toggle{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:.9rem}
.toggle[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-soft)}
.peekbox{background:var(--gold-soft);border-radius:12px;padding:12px 14px;margin-top:10px;font-family:var(--serif);font-size:1.02rem}
.debrief{margin-top:12px}
.note{border-radius:12px;padding:10px 12px;margin-bottom:8px;background:var(--surface);border:1px solid var(--line)}
.note b{font-family:var(--serif);font-size:1.08rem}
.note.trapnote{border-color:var(--red);background:var(--red-soft)}
.note p{font-size:.95rem}
.toast{text-align:center;font-weight:600;min-height:1.5em;margin:8px 0}

/* Crossword */
.cw-wrap{display:flex;justify-content:center;margin:4px 0 10px}
.cw{display:grid;gap:2px;width:100%}
.cell{position:relative;aspect-ratio:1;border-radius:4px;background:transparent}
.cell.l{background:var(--surface);border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:clamp(.8rem,4.2vw,1.25rem);text-transform:uppercase;padding:0}
.cell.l .n{position:absolute;top:1px;left:3px;font-size:.55rem;font-weight:600;color:var(--muted)}
.cell.inword{background:var(--blue-soft)}
.cell.sel{border-color:var(--blue);background:var(--blue-soft);box-shadow:inset 0 0 0 1.5px var(--blue)}
.cell.lock{color:var(--green)}
.cell.rev{color:var(--gold)}
.cell.wrong{color:var(--red);background:var(--red-soft)}
.cell.gift{color:var(--gold);background:var(--gold-soft);border-color:var(--gold)}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:8px}
.bw{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-family:var(--serif);font-size:1.08rem}
.bw.usedw{opacity:.3;text-decoration:line-through}
.cluebar{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px}
.cluebar .arrow{border:0;background:var(--blue-soft);color:var(--blue);border-radius:10px;width:36px;height:44px;font-weight:700;flex:0 0 auto}
.cluebar .clue{flex:1;font-family:var(--serif);font-size:1.02rem;line-height:1.35;padding:0 4px}
.cluebar .clue small{display:block;font-family:var(--sans);font-size:.75rem;color:var(--muted);font-weight:600}
.helpers{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.helpers button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.85rem;font-weight:600}
.rootclue{background:var(--gold-soft);border-radius:10px;padding:8px 12px;font-size:.92rem;margin-bottom:8px}
.kb{display:grid;gap:6px;margin-top:10px;user-select:none}
.kb div{display:flex;gap:4px;justify-content:center}
.kb button{flex:1;max-width:40px;height:48px;border:0;border-radius:8px;background:var(--surface);box-shadow:0 1px 0 var(--line);font-weight:700;font-size:1rem;padding:0}
.kb button.wide{max-width:64px;flex:1.5}

/* Ladder */
.lad{list-style:none;padding:0;margin:0}
.lad li{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:8px}
.lad button.w{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;padding:12px 14px;text-align:left}
.lad .wname{font-family:var(--serif);font-size:1.12rem;flex:1}
.bars{display:flex;gap:3px}
.bars i{width:16px;height:8px;border-radius:2px;background:var(--line)}
.bars i.on{background:var(--blue)}
.bars i.future{background:transparent;border:1px dashed var(--line)}
.lad .detail{padding:0 14px 12px;font-family:var(--serif);font-size:.98rem;color:var(--muted)}
.rungkey{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.8rem;color:var(--muted);margin:10px 0 14px}

.moves{list-style:none;padding:0;margin:12px 0}
.moves li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);margin-bottom:6px}
.moves .mw{font-family:var(--serif);font-size:1.08rem;flex:1}
.moves .up{color:var(--green);font-weight:700}
.moves .down{color:var(--red);font-weight:700}
.moves .held{color:var(--muted);font-weight:600}

.fb label{display:block;font-weight:600;margin:16px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:.9rem}
.chip[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}
textarea{width:100%;min-height:80px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:inherit;padding:10px 12px;resize:vertical}
.copied{background:var(--green-soft);color:var(--green);border-radius:12px;padding:10px 12px;margin-top:10px;font-weight:600}

button{touch-action:manipulation}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--bg);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 18px rgba(0,0,0,.06)}
.dock-inner{max-width:560px;margin:0 auto}
.app.docked{padding-bottom:300px}
.dock .helpers{justify-content:center;margin:8px 0 0}
.dock .dmsg{margin:4px 0;min-height:1.3em;font-size:.9rem}
.dock .kb{margin-top:0;-webkit-user-select:none;user-select:none}
.dock .kb button{height:46px;max-width:none}
.dock .cluebar{padding:6px}
.dock .cluebar .arrow{height:40px}
.cell.shade::after{content:"";position:absolute;inset:3px;border:1.5px solid var(--gold);border-radius:50%;pointer-events:none;opacity:.8}
.cell.glow{background:var(--gold-soft);border-color:var(--gold);color:var(--ink)}
.mystery{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 14px;margin-top:6px}
.mdef{font-family:var(--serif);font-size:1.15rem;text-align:center;margin:6px 0 14px}
.slots{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
.slot{width:30px;height:40px;border:0;border-bottom:3px solid var(--ink);background:none;font-weight:750;font-size:1.25rem;padding:0}
.ltiles{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.ltile{width:42px;height:46px;border-radius:10px;border:1.5px solid var(--gold);background:var(--gold-soft);font-weight:750;font-size:1.2rem;padding:0}
.bank{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.bw{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-family:var(--serif);font-size:1.05rem}
.bw.usedw{opacity:.3;text-decoration:line-through}
@media (max-width:380px){.slot{width:24px}.ltile{width:36px;height:42px}}

.bonus{display:flex;align-items:center;gap:14px;border:1.5px dashed var(--gold);background:var(--gold-soft);border-radius:16px;padding:14px;margin:0 0 16px}
.bonus .info{flex:1;min-width:0}
.bonus small{display:block;font-size:.76rem;font-weight:700;color:var(--gold)}
.bonus b{display:block;font-size:1.05rem}
.bonus span{font-size:.85rem;color:var(--muted)}
.bonus button{border:1.5px solid var(--gold);background:var(--surface);border-radius:10px;padding:8px 12px;font-weight:600;font-size:.9rem}
.mdots{display:inline-flex;gap:4px;margin-left:6px;vertical-align:middle}
.mdots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.mdots i.on{background:var(--ink)}
.gtiles{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:4px}
.gt{aspect-ratio:1.15;border:0;border-radius:10px;background:var(--blue-soft);color:var(--ink);font-family:var(--sans);font-weight:700;text-transform:uppercase;letter-spacing:.01em;font-size:clamp(.6rem,2.9vw,.9rem);padding:4px 3px;overflow-wrap:anywhere;line-height:1.15}
.gt[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.gbar{border-radius:12px;padding:12px 14px;margin-bottom:6px;text-align:center;color:#182033}
.gbar b{display:block;font-size:.95rem;text-transform:uppercase;letter-spacing:.04em}
.gbar span{font-size:.9rem;text-transform:uppercase;font-weight:600}
.gbar p{font-size:.88rem;margin-top:6px;text-align:left;opacity:.9}
.gbar.rev{opacity:.85}
.g0{background:#F2D46B}.g1{background:#A8D672}.g2{background:#9DBBEA}.g3{background:#C9A8E8}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="app" id="app" aria-live="polite"></main>

<script>
/* ============ CONTENT ============ */
const WORDS={
 sanguine:{pos:"adjective",def:"Calmly optimistic, especially when a situation looks difficult.",sent:"Despite three failed launches, the manager remained sanguine about Friday's release.",root:"Contains sangu-, from the Latin for blood."},
 laconic:{pos:"adjective",def:"Using very few words, often in a dry, understated way.",sent:"'Fine,' said the laconic rancher, and went back to work.",root:"Named for Laconia, home of the famously brief Spartans."},
 obsequious:{pos:"adjective",def:"So eager to please or obey that it becomes uncomfortable to watch.",sent:"The obsequious assistant laughed a little too loudly at every one of the CEO's jokes.",root:"Contains sequ-, Latin for follow (as in sequence)."},
 equivocate:{pos:"verb",def:"To speak ambiguously on purpose, so you can't be pinned down.",sent:"Asked a direct question, the senator began to equivocate.",root:"equi (equal) + voc (voice): two meanings with equal voice."},
 recalcitrant:{pos:"adjective",def:"Stubbornly refusing to cooperate or be controlled.",sent:"Even after three warnings, the recalcitrant students kept their phones out.",root:"From Latin for kicking back with the heel, like a mule."},
 perfunctory:{pos:"adjective",def:"Done only because it has to be, with little care or real interest.",sent:"She gave the report a perfunctory glance before signing it.",root:"per + fungi (Latin, to perform): getting it over with."},
 insouciant:{pos:"adjective",def:"Relaxed and unbothered, especially when you might be expected to worry.",sent:"He strolled in forty minutes late with an insouciant wave.",root:"French: in- (not) + soucier (to worry)."},
 parsimonious:{pos:"adjective",def:"Unwilling to spend money, to a fault.",sent:"The parsimonious landlord refused to fix the heating until December.",root:"From Latin parsimonia, sparingness."},
 reticent:{pos:"adjective",def:"Reluctant to share your thoughts or feelings.",sent:"She was reticent about her past and changed the subject whenever it came up.",root:"From Latin reticere, to keep silent."},
 complacent:{pos:"adjective",def:"Self-satisfied and unaware of possible danger.",sent:"After years of winning, the team grew complacent and stopped training hard.",root:"Contains plac-, from Latin placere, to please."},
 sycophantic:{pos:"adjective",def:"Flattering powerful people to win their favor.",sent:"The minister was surrounded by sycophantic aides who praised every idea.",root:"From Greek sykophantes, originally an informer."},
 ebullient:{pos:"adjective",def:"Bubbling over with cheerful energy.",sent:"The ebullient host greeted every guest with a hug and a joke.",root:"From Latin ebullire, to boil up."},
 garrulous:{pos:"adjective",def:"Talking too much, especially about trivial things.",sent:"The garrulous passenger narrated his entire vacation during the flight.",root:"From Latin garrire, to chatter."},
 mendacious:{pos:"adjective",def:"Habitually lying or untruthful.",sent:"The investigation exposed a mendacious campaign built on invented statistics.",root:"From Latin mendax, lying."},

function applyMoves(day,game,outcomes,gameRung){
  const firstPlay=!res(day)[game+"_counted"];
  if(!firstPlay)return[];
  res(day)[game+"_counted"]=true;
  const out=[];
  for(const o of outcomes){
    const from=S.rungs[o.word]??0;let to=from;
    if(o.result==="pass")to=Math.max(from,Math.min(o.rung||gameRung,from+1));
    else if(o.result==="fail")to=Math.max(1,from-1);
    else if(o.result==="enter")to=Math.max(from,1);
    S.rungs[o.word]=to;
    const m={day,game,word:o.word,from,to,result:o.result};
    S.moves.push(m);out.push(m);
  }
  save();return out;
}

      const rr=row+dr*i,cc=col+dc*i,key=k(rr,cc),ex=grid.get(key);
      if(ex){if(ex!==word[i]||dirs.get(key).has(dir))return -1;cross++}
      else{
        if(dir==="a"&&(grid.has(k(rr-1,cc))||grid.has(k(rr+1,cc))))return -1;
        if(dir==="d"&&(grid.has(k(rr,cc-1))||grid.has(k(rr,cc+1))))return -1;
      }
    }
    return cross;
  }
  function bounds(extra){
    let r0=1e9,r1=-1e9,c0=1e9,c1=-1e9;
    const pts=[...grid.keys()].map(s=>s.split(",").map(Number));if(extra)pts.push(...extra);
    for(const[a,b]of pts){r0=Math.min(r0,a);r1=Math.max(r1,a);c0=Math.min(c0,b);c1=Math.max(c1,b)}
    return{r0,r1,c0,c1,h:r1-r0+1,w:c1-c0+1};
  }
  function place(item,row,col,dir){
    const dr=dir==="d"?1:0,dc=dir==="a"?1:0,cells=[];
    for(let i=0;i<item.a.length;i++){const key=k(row+dr*i,col+dc*i);grid.set(key,item.a[i]);if(!dirs.has(key))dirs.set(key,new Set());dirs.get(key).add(dir);cells.push(key)}
    entries.push({item,word:item.a,r:row,c:col,dir,cells});
  }
  place(items[0],0,0,"a");
  for(let pass=0;pass<2;pass++)for(const it of items){
    if(entries.length>=6)break;
    if(entries.some(e=>e.item.w===it.w||e.word===it.a))continue;
    let best=null;
    for(const[key,ch]of grid){
      if(dirs.get(key).size>1)continue;
      const d=[...dirs.get(key)][0]==="a"?"d":"a";const[cr,cc]=key.split(",").map(Number);
      for(let j=0;j<it.a.length;j++){
        if(it.a[j]!==ch)continue;
        const row=d==="d"?cr-j:cr,col=d==="a"?cc-j:cc;
        const x=fits(it.a,row,col,d);if(x<1)continue;
        const b=bounds([[row,col],[row+(d==="d"?it.a.length-1:0),col+(d==="a"?it.a.length-1:0)]]);
        if(b.h>MAX||b.w>MAX)continue;
        const sc=x*10-Math.max(b.h,b.w)*.5+r()*3;
        if(!best||sc>best.sc)best={sc,row,col,d};
      }
    }
    if(best)place(it,best.row,best.col,best.d);
  }
  if(entries.length<5)return null;
  return{grid,entries,b:bounds()};
}
function pickShade(g,word,r){
  const cells=shuffle([...g.grid.keys()],r),used=new Set(),out=[];
  for(const ch of word){const c=cells.find(x=>!used.has(x)&&g.grid.get(x)===ch);if(!c)return null;used.add(c);out.push(c)}
  return out;
}
function genCross(day){
  if(cwCache[day])return cwCache[day];
  const met=w=>!CASE_WORDS.includes(w)||CASE_WORDS.indexOf(w)<day;
  const focus=new Set([CASES[day-1].word,...BOARDS[day-1].rounds.flatMap(x=>[...x.a,x.t]).filter(w=>WORDS[w])]);
  const pref=CROSS[day-1];
  for(let att=0;att<1500;att++){
    const r=rng(day*1009+att*7919+1);
    const pool=CLUES.filter(x=>met(x.w)&&!pref.includes(x.w));
    const items=[...shuffle(pool.filter(x=>focus.has(x.w)),r),...shuffle(pool.filter(x=>!focus.has(x.w)),r)];
    const g=buildGrid(items,r);if(!g)continue;
    const used=new Set(g.entries.map(e=>e.item.w));
    const cands=att<1000?pref:[...pref,...Object.keys(WORDS).filter(w=>met(w)&&!used.has(w)&&!pref.includes(w)).sort((a,b)=>a.length-b.length)];
    for(const m of cands){
      const sh=pickShade(g,m.toUpperCase(),r);if(!sh)continue;
      const b=g.b,norm=key=>{const[a,c]=key.split(",").map(Number);return(a-b.r0)+","+(c-b.c0)};
      const cells={};for(const[key,ch]of g.grid)cells[norm(key)]=ch;
      const entries=g.entries.map((e,i)=>({id:i,word:e.word,w:e.item.w,dir:e.dir,r:e.r-b.r0,c:e.c-b.c0,cells:e.cells.map(norm),clue:e.item.c+" ("+e.word.length+")"}));
      const starts=[...new Set(entries.map(e=>e.r+","+e.c))].sort((x,y)=>{const[a1,b1]=x.split(",").map(Number),[a2,b2]=y.split(",").map(Number);return a1-a2||b1-b2});
      const nums={};starts.forEach((s,i)=>nums[s]=i+1);
      entries.forEach(e=>e.num=nums[e.r+","+e.c]);
      entries.sort((a,b)=>(a.dir===b.dir?a.num-b.num:(a.dir==="a"?-1:1)));
      return(cwCache[day]={h:b.h,w:b.w,cells,entries,nums,shade:sh.map(norm),mystery:m});
    }
  }
  return null;
}

function tapTile(t){
  const b=BOARDS[V.day-1],g=V.g,rd=b.rounds[g.round];
  if(g.peek){
    g.peek=false;g.peeked.add(t);
    g.peekText=`<b>${t}</b>: ${esc(WORDS[t]?WORDS[t].sent:b.notes[t])}`;return;
  }
  g.peekText="";
  if(g.state[t])return;
  if(rd.a.includes(t)){
    g.state[t]="hit";g.found.push(t);
    if(rd.a.every(w=>g.state[w]==="hit"))endRound(g.roundLives?"wobble":"clean");
  }else if(t===rd.t){
    g.state[t]="trap";rd.a.forEach(w=>{if(!g.state[w])g.state[w]="shown"});endRound("trap");
  }else{
    g.lives--;g.roundLives++;g.shake=t;
    if(g.lives<=0){rd.a.forEach(w=>{if(!g.state[w])g.state[w]="shown"});endRound("lost")}
    else setTimeout(()=>{const el=$("#cwToast");if(el)el.textContent="Not that one. It doesn't fit this signal."},10);
  }
}
function endRound(r){
  const g=V.g;g.results.push(r);g.phase="debrief";
  if(r==="lost"||g.round>=2){
    if(r==="lost")while(g.results.length<3)g.results.push("lost");
    g.over=true;finishCodewords();

  const b=BOARDS[V.day-1],g=V.g,rd=b.rounds[g.round];
  [...rd.a,rd.t].forEach(w=>{if(g.state[w]==="shown"||g.state[w]==="hit"||g.state[w]==="trap")g.state[w]="used";else if(!g.state[w])g.state[w]="used"});
  g.round++;g.phase="play";g.roundLives=0;
}

    if(WORDS[rd.t]){const w=rd.t;if(g.peeked.has(w))outs.push({word:w,result:"none"});else outs.push({word:w,result:(rr==="clean"||rr==="wobble")?"pass":"fail"})}

       mys:{tiles:shuffle(P.mystery.toUpperCase().split("").map((l,i)=>({l,id:i})),r),slots:[],tries:0,hint:false,gaveUp:false,solved:false,shake:false,msg:""}};

function entryAt(cell,dir){return V.g.P.entries.find(e=>e.dir===dir&&e.cells.includes(cell))}

function lockEntry(e){const g=V.g;e.cells.forEach(c=>{g.letters[c]=g.P.cells[c];g.locked[c]=true;delete g.wrong[c]});g.used[e.word]=true}

function autoCheck(cell){
  const g=V.g;let solvedAny=false;
  entriesWith(cell).forEach(e=>{
    if(entrySolved(e)||e.cells.some(c=>!g.letters[c]))return;
    const bad=e.cells.filter(c=>g.letters[c]!==g.P.cells[c]);
    if(!bad.length){lockEntry(e);solvedAny=true;g.msg=`${e.word.toLowerCase()} ✓`}
    else{bad.forEach(c=>g.wrong[c]=true);g.stats[e.id].fails++;g.msg=g.stats[e.id].fails===1?"Not quite. Think about what the clue's key word means.":"Still not it. Try a reveal if you're stuck."}
  });
  return solvedAny;
}
function gridCheck(){if(Object.keys(V.g.P.cells).every(c=>V.g.locked[c])){V.g.phase="mystery";V.g.msg="";V.g.gridEnd=Date.now()}}
function cwType(l){
  const g=V.g,e=curEntry();
  if(g.locked[g.sel]){const nx=e.cells.find(c=>!g.locked[c]);if(!nx)return;g.sel=nx}
  g.letters[g.sel]=l;delete g.wrong[g.sel];g.msg="";
  const solved=autoCheck(g.sel);
  if(solved&&entrySolved(e)){gridCheck();if(g.phase==="grid")selectNextOpen();return}
  const i=e.cells.indexOf(g.sel);
  const nx=e.cells.slice(i+1).find(c=>!g.locked[c]);if(nx)g.sel=nx;
  gridCheck();
}
function cwBack(){
  const g=V.g,e=curEntry();
  if(g.letters[g.sel]&&!g.locked[g.sel]){delete g.letters[g.sel];delete g.wrong[g.sel];return}
  const i=e.cells.indexOf(g.sel);
  for(let j=i-1;j>=0;j--){if(!g.locked[e.cells[j]]){g.sel=e.cells[j];delete g.letters[g.sel];delete g.wrong[g.sel];break}}
}
function cwRevealLetter(){
  const g=V.g;if(g.locked[g.sel])return;
  g.letters[g.sel]=g.P.cells[g.sel];g.locked[g.sel]=true;g.revealed[g.sel]=true;delete g.wrong[g.sel];
  entriesWith(g.sel).forEach(e=>g.stats[e.id].reveals++);
  entriesWith(g.sel).forEach(e=>{if(e.cells.every(c=>g.letters[c]===g.P.cells[c]))lockEntry(e)});
  gridCheck();if(g.phase==="grid"&&entrySolved(curEntry()))selectNextOpen();else{const nx=curEntry().cells.find(c=>!g.locked[c]);if(nx)g.sel=nx}
}
function cwRevealWord(){
  const g=V.g,e=curEntry();
  e.cells.forEach(c=>{if(!g.locked[c])g.revealed[c]=true});lockEntry(e);g.stats[e.id].revealed=true;g.msg="";
  g.P.entries.forEach(x=>{if(!entrySolved(x)&&x.cells.every(c=>g.letters[c]===g.P.cells[c]))lockEntry(x)});
  gridCheck();if(g.phase==="grid")selectNextOpen();
}
function placeFromBank(word){
  const g=V.g,e=curEntry();
  if(g.used[word])return;
  if(entrySolved(e)){g.msg="That one's solved. Pick another clue.";return}
  if(word.length!==e.word.length){g.msg=`That doesn't fit. This space needs ${e.word.length} letters.`;g.bounce=word;return}
  if(word!==e.word){g.stats[e.id].fails++;g.msg="Not quite. Think about what the clue's key word means.";g.bounce=word;return}
  lockEntry(e);g.msg=`${word.toLowerCase()} ✓`;
  g.P.entries.forEach(x=>{if(!entrySolved(x)&&x.cells.every(c=>g.letters[c]===g.P.cells[c]))lockEntry(x)});
  gridCheck();if(g.phase==="grid")selectNextOpen();
}
function mysTile(id){
  const m=V.g.mys,len=V.g.P.mystery.length;
  if(m.solved||m.slots.includes(id)||m.slots.length>=len)return;
  m.slots.push(id);m.msg="";
  if(m.slots.length===len){
    const guess=m.slots.map(i=>m.tiles.find(t=>t.id===i).l).join("");
    if(guess===V.g.P.mystery.toUpperCase()){m.solved=true;finishCrossword()}
    else{m.tries++;m.shake=true;m.slots=[];m.msg=m.tries===1?"Not that one. Shuffle it around and try again.":"Still not it. A hint might help."}
  }
}
function finishCrossword(){
  const g=V.g,m=g.mys;g.done=true;g.phase="done";g.end=Date.now();
  const outs=g.P.entries.map(e=>{const s=g.stats[e.id];
    if(s.revealed||s.fails>1)return{word:e.w,result:"fail"};if(s.reveals>0)return{word:e.w,result:"none"};return{word:e.w,result:"pass"}});
  let mr="none";if(m.gaveUp||m.tries>2)mr="fail";else if(m.tries<=1&&!m.hint)mr="pass";
  outs.push({word:g.P.mystery,result:mr,rung:3});
  applyMoves(V.day,"crossword",outs,2);
  const secs=Math.round((g.end-g.start)/1000);
  res(V.day).crossword={summary:`Solved in ${Math.floor(secs/60)}:${String(secs%60).padStart(2,"0")} · mystery word ${m.gaveUp?"revealed":"found"}`};
  save();
}
function renderGrid(){

function crossShare(){

/* --- Groupings --- */
const GCOL=["🟨","🟩","🟦","🟪"];
function startGroupings(){
  const B=GROUPINGS[V.day];
  V.g={type:"groupings",B,tiles:shuffle(B.groups.flatMap(x=>x.words),rng(V.day*71+9)),sel:[],solved:[],revealed:[],mistakes:0,guesses:[],seen:[],msg:"",over:false,shake:false};
}
function groupOf(w){return V.g.B.groups.findIndex(x=>x.words.includes(w))}
function gSubmit(){
  const g=V.g,B=g.B;if(g.sel.length!==4)return;
  const key=[...g.sel].sort().join("|");
  if(g.seen.includes(key)){g.msg="You already tried that one.";return}
  g.seen.push(key);g.guesses.push(g.sel.map(groupOf));
  const gi=groupOf(g.sel[0]);
  if(g.sel.every(w=>groupOf(w)===gi)){
    g.solved.push(gi);g.tiles=g.tiles.filter(w=>!g.sel.includes(w));g.sel=[];g.msg="";
    if(g.solved.length===B.groups.length)finishGroupings(true);
    return;
  }
  g.mistakes++;g.shake=true;
  const counts={};g.sel.forEach(w=>counts[groupOf(w)]=(counts[groupOf(w)]||0)+1);
  const best=Math.max(...Object.values(counts));
  g.msg=best===3?"One away…":"Not a group.";
  if(g.mistakes>=B.mistakes){
    B.groups.forEach((x,i)=>{if(!g.solved.includes(i)){g.revealed.push(i)}});
    g.tiles=[];g.sel=[];finishGroupings(false);
  }
}
function finishGroupings(won){
  const g=V.g,B=g.B;g.over=true;g.won=won;
  const outs=[];
  B.groups.forEach((x,i)=>x.words.forEach(w=>{if(WORDS[w])outs.push({word:w,result:g.solved.includes(i)?"pass":"fail"})}));
  applyMoves(V.day,"groupings",outs,2);
  res(V.day).groupings={summary:won?`Solved with ${g.mistakes} mistake${g.mistakes===1?"":"s"}`:`${g.solved.length} of ${B.groups.length} groups found`};
  save();
}
function renderGroupings(){
  const g=V.g,B=g.B;
  let h=topbar(true);
  h+=`<div class="status"><span>Groupings · ${B.title}</span><span class="small muted">Mistakes left <span class="mdots">${Array.from({length:B.mistakes},(_,i)=>`<i class="${i<B.mistakes-g.mistakes?"on":""}"></i>`).join("")}</span></span></div>`;
  if(!g.over&&!g.solved.length)h+=`<p class="muted small" style="margin-bottom:10px">Find ${B.groups.length} groups of four. Some are your words, some are trivia, and a few tiles look like they belong in two groups.</p>`;
  const bars=[...g.solved.map(i=>({i,rev:false})),...g.revealed.map(i=>({i,rev:true}))];
  bars.forEach(({i,rev})=>{const x=B.groups[i];
    h+=`<div class="gbar g${i}${rev?" rev":""}"><b>${esc(x.name)}</b><span>${x.words.join(", ")}</span>${g.over?`<p>${esc(x.note)}</p>`:""}</div>`});
  if(!g.over){
    h+=`<div class="gtiles ${g.shake?"shake":""}">${g.tiles.map(w=>`<button class="gt" data-a="gtile" data-w="${esc(w)}" aria-pressed="${g.sel.includes(w)}">${esc(w)}</button>`).join("")}</div>`;
    h+=`<div class="toast">${esc(g.msg)}</div>`;
    h+=`<div class="row"><button class="btn ghost" data-a="gshuffle">Shuffle</button><button class="btn ghost" data-a="gclear" ${g.sel.length?"":"disabled"}>Deselect</button><button class="btn" data-a="gsubmit" ${g.sel.length===4?"":"disabled"}>Submit</button></div>`;
    g.shake=false;
  }else{
    h+=`<p class="verdict" style="margin-top:12px">${g.won?(g.mistakes?"Solved":"Perfect"):"Nice try"}</p>`;
    h+=`<div class="stack"><button class="btn ghost" data-a="share">Copy result to share</button><div id="shareMsg" class="toast"></div><button class="btn" data-a="home">Back to today</button></div>`;
  }
  return h;
}
function grShare(){return`Rung · Groupings, Day ${V.day}\n`+V.g.guesses.map(r=>r.map(i=>GCOL[i]).join("")).join("\n")}

async function copy(text,target,okMsg){

    try{const ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();ok=document.execCommand("copy");ta.remove()}catch(e2){}
  }

}
let resetArmed=false;
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-a]");if(!b)return;
  const a=b.dataset.a;
  if(a!=="reset")resetArmed=false;
  switch(a){
    case"home":go("home");break;
    case"ladder":go("ladder");break;

    case"feedback":go("feedback");break;
    case"recap":go("recap");break;
    case"day":{const n=+b.dataset.d;if(n>=1&&n<=unlocked()){V.day=n;go("home")}break}
    case"calendar":calMonth=null;go("calendar");break;
    case"calprev":case"calnext":calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()+(a==="calnext"?1:-1),1);render();break;
    case"start":{const nx=GAMES.find(g=>!res(V.day)[g.id]);play(nx?nx.id:"case",true);break}
    case"play":play(b.dataset.g,b.dataset.flow==="1"||V.flow&&V.screen!=="home");break;
    case"reset":
      if(!resetArmed){resetArmed=true;b.textContent="Tap again to erase progress";break}
      S=fresh();save();V.day=today();resetArmed=false;go("home");break;
    case"accuse":{const g=V.g,i=+b.dataset.i;
      if(i===0){finishCase("solved")}
      else{g.elim.push(i);if(g.ev<4){g.ev++;g.fresh=true}else finishCase("cold")}
      render();break}
    case"evidence":if(V.g.ev<4){V.g.ev++;V.g.fresh=true;render()}break;
    case"share":{
      const t=V.screen==="case"?caseShare():V.screen==="codewords"?cwShare():V.screen==="groupings"?grShare():crossShare();
      copy(t,"#shareMsg","Copied. Paste it anywhere to share.");break}
    case"tile":tapTile(b.dataset.t);render();break;
    case"peek":V.g.peek=!V.g.peek;render();break;
    case"nextround":nextRound();render();break;
    case"cell":{const g=V.g;if(g.phase!=="grid")break;const key=b.dataset.k;
      if(g.sel===key){const other=entryAt(key,g.dir==="a"?"d":"a");if(other){g.dir=other.dir;g.entry=other.id}}
      else{g.sel=key;const e2=entryAt(key,g.dir)||entryAt(key,g.dir==="a"?"d":"a");g.dir=e2.dir;g.entry=e2.id}
      g.msg="";render();break}
    case"prevclue":case"nextclue":{const g=V.g,es=g.P.entries,i=es.findIndex(x=>x.id===g.entry);
      const n=es[(i+(a==="nextclue"?1:-1)+es.length)%es.length];g.entry=n.id;g.dir=n.dir;g.sel=n.cells.find(c=>!g.locked[c])||n.cells[0];g.msg="";render();break}
    case"key":cwType(b.dataset.l);render();break;
    case"back":cwBack();render();break;
    case"revletter":cwRevealLetter();render();break;
    case"revword":cwRevealWord();render();break;
    case"mode":V.g.mode=V.g.mode==="bank"?"keys":"bank";V.g.msg="";render();break;
    case"bankword":placeFromBank(b.dataset.w);render();break;
    case"mtile":mysTile(+b.dataset.id);render();break;
    case"mslot":{const m=V.g.mys,i=+b.dataset.i;if(i<m.slots.length)m.slots.splice(i,1);render();break}
    case"mclear":V.g.mys.slots=[];render();break;
    case"mhint":V.g.mys.hint=true;render();break;
    case"gtile":{const g=V.g,w=b.dataset.w;if(g.sel.includes(w))g.sel=g.sel.filter(x=>x!==w);else if(g.sel.length<4)g.sel.push(w);g.msg="";render();break}
    case"gshuffle":V.g.tiles=shuffle(V.g.tiles,Math.random);render();break;
    case"gclear":V.g.sel=[];V.g.msg="";render();break;
    case"gsubmit":gSubmit();render();break;
    case"mgiveup":V.g.mys.gaveUp=true;V.g.mys.solved=true;finishCrossword();render();break;
    case"word":openWord=openWord===b.dataset.w?null:b.dataset.w;render();break;
    case"fbchip":S.fb[b.dataset.k]=b.dataset.v;save();render();break;
    case"copyfb":copy(fbText(),"#fbMsg","Copied. Paste it into a text or email to send it back.");break;
  }
});
document.addEventListener("input",e=>{const k=e.target.dataset&&e.target.dataset.fb;if(k){S.fb[k]=e.target.value;save()}});
document.addEventListener("keydown",e=>{
  if(V.screen!=="crossword"||!V.g||V.g.phase!=="grid"||V.g.mode!=="keys"||e.metaKey||e.ctrlKey||e.altKey)return;
  if(/^[a-z]$/i.test(e.key)){cwType(e.key.toUpperCase());render();e.preventDefault()}
  else if(e.key==="Backspace"){cwBack();render();e.preventDefault()}
});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&V.screen==="home"&&V.day<today()){V.day=today();render()}});
render();
</script>
</body>
</html>
